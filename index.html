<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Mantenimiento del Coche</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Ficha de Mantenimiento</h1>
    <button id="exportDataBtn">💾 Exportar Datos</button>
<button id="importDataBtn">📂 Importar Datos</button>
<input type="file" id="importFileInput" accept=".json" hidden>

    <button id="btnHistory">📁 Ver Registro Histórico</button>
</header>

<!-- FICHA ANUAL -->
<section id="maintenanceSection">

    <!-- Contenedor principal de datos del coche -->
    <div class="car-info">

        <!-- Título dentro del contenedor -->
        <h2 class="vehicle-title">Datos del Vehículo</h2>

        <!-- Fila inputs + foto -->
        <div class="car-row">
            <!-- Inputs a la izquierda -->
            <div class="car-fields">
                <input type="text" id="brand" placeholder="Marca">
                <input type="text" id="model" placeholder="Modelo">
                <input type="number" id="carYear" placeholder="Año">
                <input type="text" id="plate" placeholder="Matrícula">
            </div>

            <!-- Foto a la derecha -->
            <div class="car-photo-container">
                <img id="carPhotoPreview" alt="Foto del coche">
                <button type="button" id="selectPhotoBtn">📷 Seleccionar foto</button>
                <input type="file" id="carPhotoInput" accept="image/*" style="display: none;">
            </div>
        </div>

    </div>

    <h3>Año de mantenimiento: <span id="year"></span></h3>

    <!-- Reparaciones -->
    <form id="repairForm">
        <input type="date" id="date" required>
        <input type="number" id="km" placeholder="Kilómetros" required>
        <select id="type" required>
    <option value="">Selecciona tipo de reparación</option>
</select>
        <input type="text" id="customType" placeholder="Escribe el tipo de reparación" style="display:none;">

        <input type="text" id="notes" placeholder="Observaciones">
        <input type="number" id="price" placeholder="Precio (€)" step="0.01" required>
        <button type="submit">Añadir Reparación</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Kilómetros</th>
                <th>Reparación</th>
                <th>Observaciones</th>
                <th>Precio (€)</th>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="currentList"></tbody>
    </table>

    <button id="closeYear">📦 Cerrar y Guardar Año</button>
</section>

<!-- REGISTRO HISTÓRICO -->
<section id="historySection" class="hidden">
    <h2>Registro Histórico</h2>
<div class="total-box">
    💰 Gasto Total Histórico: <span id="grandTotal">0 €</span>
</div>
    <label for="yearSelect">Selecciona un Registro:</label>
    <select id="yearSelect"></select>
    <button id="editYearBtn">✏️ Editar Año</button>
    <button id="exportPdfBtn">📄 Exportar a PDF</button>
    <button id="deleteYearBtn" class="danger">🗑️ Borrar Registro</button>

    <div id="historyDetail"></div>

    <button id="backToMaintenance">⬅ Volver a Ficha Anual</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="script.js"></script>
</body>
</html>
